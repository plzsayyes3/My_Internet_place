<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="最近の自分が気になるインターネットを、読み、選び、考えを残す個人用記事レーダー。" />
  <title>My Internet Place</title>
  <link rel="stylesheet" href="style.css?v=compact-20260921" />
</head>
<body>
  <header class="site-header">
    <div>
      <h1>MY INTERNET PLACE</h1>
    </div>
    <div class="meta-block">
      <div class="meta" id="generated">loading…</div>
      <div class="health" id="health"></div>
      <button class="sync-settings" id="sync-settings" type="button">SYNC SETUP</button>
      <div class="sync-status" id="sync-status">reading state: off</div>
    </div>
  </header>

  <nav class="primary-nav" id="primary-nav" aria-label="表示切替">
    <button class="nav-button is-active" data-view="deck" type="button">DECK</button>
    <button class="nav-button" data-view="ai" type="button">AI</button>
    <button class="nav-button" data-view="latest" type="button">LATEST</button>
    <button class="nav-button" data-view="keep" type="button">KEEP</button>
  </nav>

  <nav class="filters category-filters" id="filters" aria-label="ジャンルフィルター" hidden></nav>
  <nav class="filters topic-filters" id="topic-filters" aria-label="詳細ジャンルフィルター" hidden></nav>

  <main>
    <section class="deck-view" id="deck-view" aria-live="polite">
      <div class="deck-head">
        <span id="deck-progress"></span>
        <span>SWIPE TO SORT</span>
      </div>
      <div class="deck" id="deck"></div>
    </section>

    <section class="feed" id="feed" aria-live="polite" hidden></section>
    <p class="empty" id="empty" hidden>まだ記事がありません。</p>
  </main>

  <template id="deck-template">
    <article class="deck-card">
      <div class="swipe-cue swipe-cue-left" data-cue="skip">興味なし<small>離すと確定</small></div>
      <div class="swipe-cue swipe-cue-up" data-cue="read">見出しで十分<small>離すと確定</small></div>
      <div class="swipe-cue swipe-cue-right" data-cue="keep">あとで読む<small>離すと確定</small></div>

      <div class="deck-image-wrap" hidden>
        <img class="deck-image" alt="" loading="eager" decoding="async" />
      </div>

      <div class="deck-body">
        <div class="deck-topline">
          <span class="deck-source"></span>
          <span class="deck-signal"></span>
        </div>

        <h2><button class="deck-title" type="button"></button></h2>
        <p class="deck-summary"></p>
        <div class="topic-tags deck-tags"></div>

        <div class="deck-reason">
          <strong>WHY THIS?</strong>
          <span></span>
        </div>

        <div class="memo">
          <div class="memo-label">
            <span>この記事を見て思ったこと</span>
            <span class="memo-status">AUTO SAVE</span>
          </div>
          <textarea class="memo-input" placeholder="気になったこと、連想したこと、あとで調べたいこと…"></textarea>
        </div>

        <button class="read-now" type="button">
          そのまま読む
          <small>記事を開く ＋ あとで読むに残す ＋ 既読</small>
        </button>

        <div class="deck-actions">
          <button class="deck-action" data-action="skip" type="button">
            興味なし
            <small>← SWIPE</small>
          </button>
          <button class="deck-action primary" data-action="read" type="button">
            見出しで十分
            <small>↑ SWIPE</small>
          </button>
          <button class="deck-action" data-action="keep" type="button">
            あとで読む
            <small>SWIPE →</small>
          </button>
        </div>

        <p class="deck-hint">左：興味なし ／ 上：ここまで ／ 右：あとで読む</p>
      </div>
    </article>
  </template>

  <template id="list-card-template">
    <article class="list-card">
      <div class="list-topline">
        <div class="source-line">
          <span class="source"></span>
          <span class="kind"></span>
          <span class="category"></span>
          <span class="reading-state-label" hidden></span>
        </div>
        <span class="score"></span>
      </div>

      <div class="list-content">
        <div class="list-copy">
          <h2><button class="title-button" type="button"></button></h2>
          <p class="summary"></p>
          <div class="topic-tags"></div>
          <div class="list-actions">
            <button type="button" data-action="read-now">読む</button>
            <button type="button" data-action="keep">あとで読む</button>
            <button type="button" data-action="read">既読</button>
            <button type="button" data-action="skip">興味なし</button>
          </div>
        </div>
        <button class="thumbnail" type="button" hidden aria-label="記事を読む">
          <img class="thumbnail-image" alt="" loading="lazy" decoding="async" />
        </button>
      </div>

      <div class="list-footer">
        <span class="reason"></span>
        <time class="published"></time>
      </div>
    </article>
  </template>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="reading-state.js?v=state-v2-20260921"></script>
  <script src="app.js?v=ai-shelf-20260925"></script>
</body>
</html>
