# Public feed sources for My Internet Place.
# Keep this list generic and safe for a public repository.
# Official/primary feeds are preferred; discovery feeds are intentionally lower priority.
# default_category/default_item_type are fallbacks only; articles are classified individually.

version: 2

sources:
  - id: openai_news
    name: OpenAI News
    type: rss
    url: https://openai.com/news/rss.xml
    default_category: ai
    default_item_type: news
    priority: 1.0
    enabled: true

  - id: obsidian_blog
    name: Obsidian Blog
    type: rss
    url: https://obsidian.md/feed.xml
    default_category: knowledge
    default_item_type: blog
    priority: 1.0
    max_age_days: 240
    enabled: true

  - id: obsidian_changelog
    name: Obsidian Changelog
    type: rss
    url: https://obsidian.md/changelog.xml
    default_category: knowledge
    default_item_type: release
    priority: 0.95
    max_age_days: 240
    enabled: true

  - id: github_changelog
    name: GitHub Changelog
    type: rss
    url: https://github.blog/changelog/feed/
    default_category: software
    default_item_type: release
    priority: 0.95
    enabled: true

  - id: github_blog
    name: GitHub Blog
    type: rss
    url: https://github.blog/feed/
    default_category: software
    default_item_type: article
    priority: 0.75
    enabled: true

  - id: simon_willison
    name: Simon Willison's Weblog
    type: atom
    url: https://simonwillison.net/atom/everything/
    default_category: ai
    default_item_type: blog
    priority: 0.85
    enabled: true

  - id: hackaday
    name: Hackaday
    type: rss
    url: https://hackaday.com/blog/feed/
    default_category: make
    default_item_type: article
    priority: 0.65
    enabled: true

  - id: hacker_news
    name: Hacker News via HNRSS
    type: rss
    url: https://hnrss.org/frontpage
    default_category: other
    default_item_type: news
    priority: 0.5
    enabled: true
