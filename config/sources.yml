# Public RSS/Atom sources for My Internet Place.
# default_topics are fallback hints only; each article is classified from its own text.
# BLOG is represented by source_kind, not content_type.

version: 4

sources:
  - id: openai_news
    name: OpenAI News
    type: rss
    url: https://openai.com/news/rss.xml
    default_topics: [llm_ai_tools, ai_agents_automation]
    source_kind: official
    default_content_type: news
    priority: 1.0
    enabled: true

  - id: openrouter_blog
    name: OpenRouter Blog
    type: rss
    url: https://openrouter.ai/blog/feed.xml
    default_topics: [llm_ai_tools]
    source_kind: official
    default_content_type: news
    priority: 0.95
    enabled: true

  - id: google_ai_blog
    name: Google AI Blog
    type: rss
    url: https://blog.google/technology/ai/rss/
    default_topics: [llm_ai_tools]
    source_kind: official
    default_content_type: news
    priority: 0.9
    enabled: true

  - id: obsidian_blog
    name: Obsidian Blog
    type: rss
    url: https://obsidian.md/feed.xml
    default_topics: [obsidian_pkm, personal_knowledge]
    source_kind: official
    default_content_type: news
    priority: 1.0
    max_age_days: 240
    enabled: true

  - id: obsidian_changelog
    name: Obsidian Changelog
    type: rss
    url: https://obsidian.md/changelog.xml
    default_topics: [obsidian_pkm]
    source_kind: official
    default_content_type: release
    priority: 0.95
    max_age_days: 240
    enabled: true

  - id: github_changelog
    name: GitHub Changelog
    type: rss
    url: https://github.blog/changelog/feed/
    default_topics: [github_devops]
    source_kind: official
    default_content_type: release
    priority: 0.95
    enabled: true

  - id: github_blog
    name: GitHub Blog
    type: rss
    url: https://github.blog/feed/
    default_topics: [github_devops, indie_open_source]
    source_kind: official
    default_content_type: news
    priority: 0.75
    enabled: true

  - id: apple_developer_jp
    name: Apple Developer News (JP)
    type: rss
    url: https://developer.apple.com/jp/news/rss/news.rss
    default_topics: [apple_ecosystem]
    source_kind: official
    default_content_type: news
    priority: 0.9
    enabled: true

  - id: raspberry_pi_news
    name: Raspberry Pi News
    type: rss
    url: https://www.raspberrypi.com/news/feed/
    default_topics: [embedded_devices]
    source_kind: official
    default_content_type: news
    priority: 0.85
    enabled: true

  - id: simon_willison
    name: Simon Willison's Weblog
    type: atom
    url: https://simonwillison.net/atom/everything/
    default_topics: [llm_ai_tools, ai_coding]
    source_kind: blog
    default_content_type: analysis
    priority: 0.85
    enabled: true

  - id: hackaday
    name: Hackaday
    type: rss
    url: https://hackaday.com/blog/feed/
    default_topics: [embedded_devices, 3d_printing]
    source_kind: publication
    default_content_type: news
    priority: 0.65
    enabled: true

  - id: hacker_news
    name: Hacker News via HNRSS
    type: rss
    url: https://hnrss.org/frontpage
    default_topics: []
    source_kind: community
    default_content_type: news
    priority: 0.5
    enabled: true
