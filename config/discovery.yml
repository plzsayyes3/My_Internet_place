# Active-search configuration for My Internet Place.
# Public-safe search terms only. This file is intentionally separate from RSS/Atom sources.
# A scheduled ChatGPT task searches these queries and writes data/discovery.json.
# GitHub Actions then merges those results with RSS/Atom before ranking and translation.
# Optional signals connect a query to public-safe preference signals in interests.yml.

version: 4

enabled: true

defaults:
  max_results_per_query: 8
  max_age_days: 14
  languages: [ja, en]

queries:
  - id: cyberdeck
    label: Cyberdeck
    query: cyberdeck
    weight: 1.9
    topics: [embedded_devices, input_devices, hci_interfaces]
    enabled: true

  - id: diy_cyberdeck
    label: DIY Cyberdeck
    query: DIY cyberdeck
    weight: 1.8
    topics: [embedded_devices, input_devices]
    enabled: true

  - id: esp32_handheld
    label: ESP32 handheld
    query: ESP32 handheld
    weight: 1.6
    topics: [embedded_devices, wearables]
    enabled: true

  - id: esp32_epaper
    label: ESP32 e-paper
    query: ESP32 e-paper
    weight: 1.7
    topics: [embedded_devices, e_paper]
    enabled: true

  - id: m5stack_epaper
    label: M5Stack e-paper
    query: M5Stack e-paper
    weight: 1.7
    topics: [embedded_devices, e_paper]
    enabled: true

  - id: portable_epaper_computer
    label: Portable e-paper computer
    query: portable e-paper computer
    weight: 1.6
    topics: [embedded_devices, e_paper, wearables]
    enabled: true

  - id: raspberry_pi_cyberdeck
    label: Raspberry Pi cyberdeck
    query: Raspberry Pi cyberdeck
    weight: 1.6
    topics: [embedded_devices, input_devices]
    enabled: true

  - id: diy_handheld_terminal
    label: DIY handheld terminal
    query: DIY handheld terminal
    weight: 1.5
    topics: [embedded_devices, input_devices]
    enabled: true

  - id: custom_input_device
    label: Custom input device
    query: custom input device
    weight: 1.5
    topics: [input_devices, hci_interfaces]
    enabled: true

  - id: one_handed_keyboard
    label: One-handed keyboard
    query: one handed keyboard
    weight: 1.6
    topics: [input_devices, hci_interfaces]
    enabled: true

  - id: thumb_keyboard_diy
    label: Thumb keyboard DIY
    query: thumb keyboard DIY
    weight: 1.6
    topics: [input_devices, embedded_devices]
    enabled: true

  - id: tiny_computer_diy
    label: Tiny computer DIY
    query: tiny computer DIY
    weight: 1.5
    topics: [embedded_devices]
    enabled: true

  - id: pocket_computer_open_source
    label: Pocket computer open source
    query: pocket computer open source
    weight: 1.5
    topics: [embedded_devices, indie_open_source]
    enabled: true

  - id: low_power_personal_device
    label: Low-power personal device
    query: low power personal device
    weight: 1.4
    topics: [embedded_devices, e_paper]
    enabled: true

  - id: local_first_personal_tools
    label: Local-first personal tools
    query: local-first personal tools
    weight: 1.3
    topics: [local_first, personal_knowledge]
    enabled: true

  - id: pokemon
    label: ポケモン
    query: ポケモン
    weight: 1.3
    topics: [pokemon]
    signals: [pokemon]
    enabled: true

  - id: pokemon_en
    label: Pokémon
    query: Pokémon
    weight: 1.3
    topics: [pokemon]
    signals: [pokemon]
    enabled: true

  - id: pokemon_news
    label: Pokemon News
    query: Pokemon news
    weight: 1.2
    topics: [pokemon]
    signals: [pokemon]
    enabled: true
