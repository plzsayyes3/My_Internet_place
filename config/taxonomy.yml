classification:
  max_topics_per_item: 3
  minimum_topic_score: 0.25
  primary_category:
    strategy: highest_scoring_topic
    priority: [games, small_devices, ios_apple, ai, knowledge, software, making, education, work, personal_web, lifestyle, other]
  topic_matching:
    title_multiplier: 2.0
    summary_multiplier: 1.5
    metadata_multiplier: 0.5
    max_keyword_matches_per_topic: 3
  fallback:
    use_source_default_topics: true
  unknown:
    allow_unclassified: true
