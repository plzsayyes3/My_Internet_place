  foundation_models: 1.15
  llm_ai_tools: 1.00
  ai_agents_automation: 1.35
  local_ai: 1.20
  ai_coding: 1.20
  ai_use_cases: 1.00
  obsidian_pkm: 1.25
  personal_knowledge: 1.15
  daily_notes_journaling: 1.05
  handwriting_analog: 1.00
  local_first: 1.00
  systems_thinking: 0.95
  github_devops: 1.05
  web_apps: 1.05
  indie_open_source: 0.90
  obsidian_plugin_dev: 1.15
  small_tools: 1.00
  hci_interfaces: 1.00
  maker_projects: 0.95
