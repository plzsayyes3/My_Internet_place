# Signals refine attention inside a topic. They are not navigation genres.
# Positive weights boost; negative weights downrank.
interest_signals:
  - id: compact_devices
    label: 小型・携帯デバイス
    weight: 1.5
    terms:
      - small device
      - compact device
      - tiny computer
      - handheld
      - handheld computer
      - pocket computer
      - portable terminal
      - palm-sized
      - small form factor
      - 小型端末
      - 小型デバイス
      - 携帯端末
      - 手のひらサイズ

  - id: cyberdeck
    label: Cyberdeck
    weight: 1.9
    terms:
      - cyberdeck
      - cyber deck
      - portable terminal
      - portable computer
      - DIY terminal
      - handheld terminal
      - writerdeck
      - writer deck

  - id: epaper_device
    label: 電子ペーパー端末
    weight: 1.6
    terms:
      - e-paper
      - epaper
      - e-ink
      - eink
      - electronic paper
      - e-paper display
      - 電子ペーパー

  - id: practical_small_computing
    label: 実用小型コンピューティング
    weight: 1.35
    terms:
      - ESP32
      - ESP32-S3
      - M5Stack
      - M5Stick
      - Raspberry Pi Zero
      - Raspberry Pi Pico
      - Seeed Studio XIAO
      - battery powered
      - low power

  - id: custom_input
    label: 小型入力デバイス
    weight: 1.5
    terms:
      - custom keyboard
      - one handed keyboard
      - one-handed keyboard
      - chorded keyboard
      - thumb keyboard
      - Bluetooth HID
      - input device
      - macro pad
      - macropad
      - T9 keyboard
      - 自作キーボード
      - 片手キーボード
      - 入力デバイス

  - id: local_personal_tools
    label: 個人向け・Local-first
    weight: 1.1
    terms:
      - local-first
      - local first
      - personal tool
      - personal software
      - single user
      - offline first
      - self hosted
      - self-hosted

  - id: calm_personal_tech
    label: 静かな個人技術
    weight: 1.0
    terms:
      - calm technology
      - distraction free
      - minimalist device
      - focused device
      - ambient computing

  - id: pokemon
    label: ポケモン
    weight: 1.3
    terms:
      - ポケモン
      - Pokémon
      - Pokemon
      - ポケットモンスター
      - Pocket Monsters

  - id: large_robotics
    label: 大型・産業ロボティクス
    weight: -0.75
    terms:
      - industrial robot
      - industrial robotics
      - humanoid robot
      - robot arm
      - robotic arm
      - warehouse robot
      - autonomous warehouse
      - factory automation robot
      - 産業用ロボット
      - 大型ロボット
      - ロボットアーム

combinations:
  - id: pocket_epaper
    label: 小型電子ペーパー端末
    terms: [ESP32, M5Stack, e-paper, epaper, handheld, pocket, wearable, Watchy]
    required_any: [e-paper, epaper]
    min_match: 2
    bonus: 1.4

  - id: cyberdeck_build
    label: Cyberdeck制作
    terms: [cyberdeck, Raspberry Pi, ESP32, keyboard, display, battery, portable terminal]
    required_any: [cyberdeck, Raspberry Pi, ESP32, portable terminal]
    min_match: 2
    bonus: 1.6

  - id: tiny_input_device
    label: 小型入力装置
    terms: [keyboard, Bluetooth HID, one handed, thumb, handheld, ESP32, M5Stack]
    required_any: [keyboard, Bluetooth HID, one handed, thumb]
    min_match: 2
    bonus: 1.25

  - id: personal_epaper_reader
    label: 個人向けE-paper Reader
    terms: [e-paper, epaper, RSS, reader, feed, offline, personal]
    required_any: [e-paper, epaper]
    min_match: 2
    bonus: 1.15

ranking:
  signals:
    direct_interest: 1.0
    related_interest: 0.35
    freshness: 0.60
    source_priority: 0.20
    content_type_preference: 0.20

  penalties:
    duplicate_story: 1.0
    source_repetition: 0.20
    topic_repetition: 0.15
    stale_item: 0.50
    thin_content: 0.30

  discovery:
    enabled: false
    relation_min: 0.35
    relation_max: 0.80
    bonus: 0.25

  feedback:
    interested:
      direct_topic: 0.15
      related_topic: 0.04
    not_interested:
      direct_topic: -0.20
      related_topic: -0.02

  prefer:
    - recent_items
    - primary_sources
    - technical_details
    - practical_examples
    - thoughtful_long_form
    - compact_personal_devices

  downrank:
    - stale_items
    - duplicate_stories
    - clickbait
    - thin_content
    - large_industrial_hardware
