name: Collect feeds

on:
  workflow_dispatch:
  schedule:
    # Approx. 06:25, 12:25, 20:25 JST (GitHub schedules use UTC).
    - cron: "25 21,3,11 * * *"

permissions:
  contents: write

concurrency:
  group: collect-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect feeds
        run: python src/collect.py

      - name: Commit updated feed data
        run: |
          if git diff --quiet -- data/latest.json docs/data/latest.json && [ -z "$(git status --porcelain -- docs/data/latest.json)" ]; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json docs/data/latest.json
          git commit -m "Update article feed"
          git push
