name: Collect feeds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"
  schedule:
    # Approx. 06:25, 12:25, 20:25 JST (GitHub schedules use UTC).
    - cron: "25 21,3,11 * * *"

permissions:
  contents: write

concurrency:
  group: collect-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Argos English to Japanese model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-en-ja-v1

      - name: Install CPU translation runtime and dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Test taxonomy scoring
        run: python -m unittest discover -s tests

      - name: Preserve previous translations
        run: cp data/latest.json /tmp/previous-latest.json 2>/dev/null || true

      - name: Collect feeds
        run: python src/collect.py

      - name: Translate English fields to Japanese
        env:
          ARGOS_DEVICE_TYPE: cpu
          ARGOS_CHUNK_TYPE: MINISBD
        run: python src/translate.py --previous /tmp/previous-latest.json

      - name: Commit updated feed data
        run: |
          if git diff --quiet -- data/latest.json docs/data/latest.json && [ -z "$(git status --porcelain -- docs/data/latest.json)" ]; then
            echo "No feed changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json docs/data/latest.json
          git commit -m "Update article feed"

          # A human or another tool may have updated main while feeds were being
          # fetched. Replay the generated-data commit on the newest main before
          # pushing instead of failing with a non-fast-forward error.
          git pull --rebase origin main
          git push origin HEAD:main
